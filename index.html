<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudiaSecu - Tu Plataforma Escolar</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --selected-blue: #2563eb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        .admin-login-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
        }
        .btn-secret {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-secret svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-secret:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 15px;
        }
        header h1 {
            background: linear-gradient(90deg, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            margin-bottom: 8px;
            font-weight: 800;
        }
        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .timer-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 350px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timer-card span {
            font-size: 1.1rem;
            color: #cbd5e1;
            font-weight: bold;
        }
        #time-display {
            font-size: 1.3rem;
            color: #38bdf8;
            font-family: monospace;
            font-weight: bold;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .admin-panel {
            background: #111827;
            border: 2px dashed #818cf8;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: none;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .admin-btns {
            display: flex;
            gap: 10px;
        }
        .btn-resume, .btn-pause {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-pause {
            background: #8b5cf6;
        }

        .visits-table-container {
            max-height: 180px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        table.visits-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        table.visits-table th {
            background: #1f2937;
            color: #9ca3af;
            padding: 8px 12px;
            position: sticky;
            top: 0;
        }
        table.visits-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #374151;
            color: #e5e7eb;
        }

        #paused-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            text-align: center;
            padding: 20px;
        }
        .bunny-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #818cf8;
            max-width: 400px;
        }
        .bunny-emoji {
            font-size: 4.5rem;
            animation: bounceBunny 1.2s infinite ease-in-out;
            display: inline-block;
            margin-bottom: 15px;
        }
        @keyframes bounceBunny {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .bunny-box h2 {
            color: #818cf8;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }
        .bunny-box p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        #timer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #6366f1;
            max-width: 450px;
            text-align: center;
        }
        .modal-content h3 {
            color: #818cf8;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .modal-content p {
            color: #cbd5e1;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .modal-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
        }
        .modal-btn.secondary {
            background: #334155;
            color: #f8fafc;
        }

        .selector-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .group-select, .matter-select {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 220px;
        }
        label {
            font-weight: bold;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        select {
            padding: 12px;
            background: #0f172a;
            color: #f8fafc;
            border: 2px solid #334155;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }
        select:focus {
            border-color: var(--primary);
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #334155;
        }
        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 4px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #818cf8;
            border-bottom-color: #818cf8;
        }

        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }

        /* Estilos para el examen */
        #exam-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .exam-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #6366f1;
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .exam-title {
            color: #818cf8;
            font-size: 1.5rem;
        }
        .close-exam {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .exam-question {
            margin-bottom: 20px;
            color: #f8fafc;
        }
        .exam-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .exam-option {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #334155;
            cursor: pointer;
            transition: all 0.3s;
        }
        .exam-option:hover, .exam-option.selected {
            border-color: #818cf8;
            background: #2563eb;
        }
        .exam-option.correct {
            background: #22c55e;
            border-color: #22c55e;
        }
        .exam-option.incorrect {
            background: #ef4444;
            border-color: #ef4444;
        }
        .exam-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .exam-nav {
            display: flex;
            gap: 10px;
        }
        .exam-nav button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .exam-nav button:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }
        .exam-submit {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

            color:
