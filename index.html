<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudiaSecu - Tu Plataforma Escolar</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      background: linear-gradient(90deg, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.8rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Temporizador Visual */
    .timer-card {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-card span {
      font-size: 1.1rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    #time-display {
      font-size: 1.3rem;
      color: #38bdf8;
      font-family: monospace;
      font-weight: bold;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    /* Modal del Temporizador de 35 minutos */
    #timer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 2px solid #6366f1;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      color: #818cf8;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .modal-content p {
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .modal-btns {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
    }

    .modal-btn.secondary {
      background: #334155;
      color: #f8fafc;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    .selector-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .group-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    label {
      font-weight: bold;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    select {
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 2px solid #334155;
    }

    .tab-btn {
      padding: 12px 25px;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 4px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #818cf8;
      border-bottom-color: #818cf8;
    }

    .content-section {
      display: none;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-section.active {
      display: block;
    }

    .summary-card {
      background: #0f172a;
      border-left: 6px solid var(--primary);
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 0 10px 10px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .summary-card h3 {
      margin-bottom: 6px;
      color: #818cf8;
      font-size: 1.15rem;
    }

    .summary-card p {
      font-size: 1rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .quiz-info {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .question-block {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      transition: all 0.3s ease;
    }

    .question-block.correct-answer {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.12);
    }

    .question-block.wrong-answer {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.05rem;
      color: #f1f5f9;
    }

    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      padding: 12px 15px;
      border: 2px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      color: #e2e8f0;
    }

    .option-label:hover {
      background: #334155;
      border-color: #64748b;
    }

    .explanation {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .question-block.correct-answer .explanation {
      display: block;
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .question-block.wrong-answer .explanation {
      display: block;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .submit-btn {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    #score-result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Modal del Temporizador de 35 minutos -->
  <div id="timer-modal">
    <div class="modal-content">
      <h3>⏰ ¡Tiempo Cumplido!</h3>
      <p>Ya han pasado 35 minutos de estudio continuo. ¿Deseas seguir estudiando o quieres irte?</p>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="handleTimerDecision('leave')">Me quiero ir</button>
        <button class="modal-btn primary" onclick="handleTimerDecision('continue')">Seguir estudiando</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>EstudiaSecu</h1>
      <p>Plataforma Escolar Interactiva para Exámenes</p>
    </header>

    <!-- Temporizador visual en pantalla -->
    <div class="timer-card">
      <span>⏱️ Tiempo de Estudio:</span>
      <div id="time-display">35:00</div>
    </div>

    <!-- Controles de Selección -->
    <div class="selector-card">
      <div class="group-select">
        <label for="grade-select">Grado Escolar:</label>
        <select id="grade-select" onchange="updateSubjectsAndContent()">
          <option value="1">1º de Secundaria</option>
          <option value="2" selected>2º de Secundaria</option>
          <option value="3">3º de Secundaria</option>
        </select>
      </div>

      <div class="group-select">
        <label for="subject-select">Materia:</label>
        <select id="subject-select" onchange="renderAll()">
          <!-- Opciones dinámicas -->
        </select>
      </div>

      <div class="group-select">
        <label for="term-select">Trimestre:</label>
        <select id="term-select" onchange="renderAll()">
          <option value="1">1er Trimestre</option>
          <option value="2">2do Trimestre</option>
          <option value="3">3er Trimestre</option>
        </select>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('study')">Puntos Clave (Estudiar)</button>
      <button class="tab-btn" onclick="switchTab('quiz')">Quiz Examen (50 Preguntas)</button>
    </div>

    <!-- Sección de Estudio -->
    <div id="study-section" class="content-section active">
      <h2 id="study-title" style="margin-bottom: 20px; font-size: 1.4rem; color: #818cf8;"></h2>
      <div id="study-content"></div>
    </div>

    <!-- Sección de Quiz -->
    <div id="quiz-section" class="content-section">
      <h2 id="quiz-title" style="margin-bottom: 10px; font-size: 1.4rem; color: #818cf8;">Simulador de Examen</h2>
      <div class="quiz-info" id="quiz-info"></div>
      <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="evaluateQuiz()">Calificar Examen Completo</button>
      </form>
      <div id="score-result"></div>
    </div>
  </div>

  <script>
    const summariesData = {
      2: {
        algebra: {
          1: [
            { topic: "1. Álgebra", text: "Uso de literales para generalizar propiedades aritméticas y modelar patrones numéricos." },
            { topic: "2. Proporcionalidad", text: "Estudio de la variación lineal directa (y = kx) y razones inversas." },
            { topic: "3. Geometría", text: "Aplicación del Teorema de Pitágoras (c² = a² + b²) y propiedades de los polígonos." },
            { topic: "4. Estadística y Probabilidad", text: "Análisis de medidas de tendencia central e histogramas de frecuencias." }
          ],
          2: [
            { topic: "1. Álgebra", text: "Resolución analítica de ecuaciones de primer grado y sistemas de ecuaciones lineales." },
            { topic: "2. Proporcionalidad", text: "Cálculos de interés simple, porcentajes avanzados y tasas de cambio." },
            { topic: "3. Geometría", text: "Cálculo formal de áreas de figuras compuestas y volúmenes de prismas." },
            { topic: "4. Estadística y Probabilidad", text: "Probabilidad teórica y frecuencial en eventos aleatorios." }
          ],
          3: [
            { topic: "1. Álgebra", text: "Modelación y solución de ecuaciones cuadráticas (segundo grado)." },
            { topic: "2. Proporcionalidad", text: "Funciones y relaciones de dependencia no lineal." },
            { topic: "3. Geometría", text: "Criterios de semejanza de triángulos y trigonometría básica." },
            { topic: "4. Estadística y Probabilidad", text: "Desviación estándar y análisis probabilístico avanzado." }
          ]
        }
      }
    };

    function getSubjectsByGrade(grade) {
      if (grade === "2") {
        return [
          { id: "algebra", name: "Álgebra (Matemáticas II)" },
          { id: "fisica", name: "Física (Ciencias II)" },
          { id: "espanol", name: "Español II" },
          { id: "historia_de_mexico", name: "Historia de México" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés II" },
          { id: "artes", name: "Artes II" },
          { id: "tecnologia", name: "Tecnología II" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      } else if (grade === "3") {
        return [
          { id: "matematicas", name: "Matemáticas III" },
          { id: "quimica", name: "Química (Ciencias III)" },
          { id: "espanol", name: "Español III" },
          { id: "historia", name: "Historia Universal" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés III" },
          { id: "artes", name: "Artes III" },
          { id: "tecnologia", name: "Tecnología III" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      } else {
        return [
          { id: "matematicas", name: "Matemáticas I" },
          { id: "biologia", name: "Biología (Ciencias I)" },
          { id: "espanol", name: "Español I" },
          { id: "historia", name: "Historia I" },
          { id: "geografia", name: "Geografía" },
          { id: "formacion", name: "Formación Cívica y Ética I" },
          { id: "ingles", name: "Inglés I" },
          { id: "artes", name: "Artes I" },
          { id: "tecnologia", name: "Tecnología I" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      }
    }

    function updateSubjectsAndContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjects = getSubjectsByGrade(grade);

      subjectSelect.innerHTML = '';
      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub.id;
        opt.textContent = sub.name;
        subjectSelect.appendChild(opt);
      });

      renderAll();
    }

    // Bancos de preguntas 100% independientes, exclusivos y sin cruces entre trimestres
    function getFullBank(grade, subject, term) {
      let pool = [];

      if (grade === "2" && subject === "algebra") {
        if (term === "1") {
          // EXCLUSIVO TRIMESTRE 1: Fundamentos y conceptos base
          pool = [
            { q: "[Trimestre 1] ¿Qué función cumplen específicamente las literales en el eje de Álgebra inicial?", opts: ["Variables para generalizar relaciones aritméticas y modelar valores desconocidos", "Unidades físicas de longitud fija", "Sustitución nula de operaciones", "Errores aritméticos"], correct: 0, exp: "💡 Explicación: Las literales abstraen patrones aplicables a cualquier conjunto numérico." },
            { q: "[Trimestre 1] ¿Cómo se modela algebraicamente una variación lineal directa?", opts: ["y = kx, donde k es la constante de proporcionalidad directa", "y = x + k", "y = k / x", "y = x²"], correct: 0, exp: "💡 Explicación: El cociente entre ambas magnitudes se mantiene constante." },
            { q: "[Trimestre 1] ¿Qué calcula fundamentalmente el Teorema de Pitágoras?", opts: ["La relación geométrica entre los catetos y la hipotenusa en triángulos rectángulos (c² = a² + b²)", "La suma total de los ángulos internos", "El área de un círculo", "El perímetro de un cuadrado"], correct: 0, exp: "💡 Explicación: Es el principio geométrico para triángulos rectángulos." },
            { q: "[Trimestre 1] ¿Cómo se obtiene la media aritmética de un conjunto de datos?", opts: ["Sumando todos los valores numéricos y dividiendo entre el total de elementos", "Tomando el valor del centro", "Identificando la moda", "Restando el mínimo al máximo"], correct: 0, exp: "💡 Explicación: Representa el promedio ponderado o punto de equilibrio estadístico." },
            { q: "[Trimestre 1] Al evaluar la expresión algebraica 4x - 3 cuando x = 6, ¿cuál es el resultado?", opts: ["21", "24", "18", "9"], correct: 0, exp: "💡 Explicación: 4(6) - 3 = 24 - 3 = 21." }
          ];
        } else if (term === "2") {
          // EXCLUSIVO TRIMESTRE 2: Procedimientos intermedios, ecuaciones lineales y sistemas
          pool = [
            { q: "[Trimestre 2] ¿Cuál es el propósito analítico del método de suma y resta en sistemas de ecuaciones?", opts: ["Igualar coeficientes para eliminar una incógnita y reducir el sistema a una ecuación lineal", "Multiplicar las variables de forma cruzada", "Graficar sin realizar operaciones algebraicas", "Elevar al cuadrado ambos miembros"], correct: 0, exp: "💡 Explicación: Permite eliminar una variable para resolver la restante de forma sencilla." },
            { q: "[Trimestre 2] Si un capital de $2,000 genera una tasa de interés simple anual del 10%, ¿cuánto genera en 1 año?", opts: ["$200", "$2,200", "$100", "$20"], correct: 0, exp: "💡 Explicación: Aplicando la fórmula de interés simple I = C·i·t → 2000 × 0.10 × 1 = $200." },
            { q: "[Trimestre 2] ¿Cómo se calcula el volumen total de un prisma recto de base rectangular?", opts: ["Multiplicando el área de su base por la altura total del cuerpo geométrico", "Sumando todos sus lados lineales", "Multiplicando largo por ancho únicamente", "Dividiendo el perímetro entre dos"], correct: 0, exp: "💡 Explicación: V = Área de la base × altura." },
            { q: "[Trimestre 2] Al lanzar un dado regular de 6 caras, ¿cuál es la probabilidad teórica de obtener un número par?", opts: ["3/6 o 1/2 (50%)", "1/6", "2/3", "1"], correct: 0, exp: "💡 Explicación: Los casos favorables son {2, 4, 6}, es decir, 3 de un total de 6 caras." },
            { q: "[Trimestre 2] Al despejar x en la ecuación lineal 2x + 10 = 26, ¿cuál es su valor numérico?", opts: ["x = 8", "x = 18", "x = 6", "x = 13"], correct: 0, exp: "💡 Explicación: 2x = 26 - 10 → 2x = 16 → x = 8." }
          ];
        } else {
          // EXCLUSIVO TRIMESTRE 3: Análisis avanzado y ecuaciones cuadráticas
          pool = [
            { q: "[Trimestre 3] ¿Qué forma geométrica adopta la representación gráfica de una ecuación cuadrática (ax² + bx + c)?", opts: ["Una parábola simétrica con un punto máximo o mínimo (vértice)", "Una línea recta continua infinita", "Una circunferencia perfecta", "Una hipérbola abierta"], correct: 0, exp: "💡 Explicación: Toda función de segundo grado describe gráficamente una parábola." },
            { q: "[Trimestre 3] ¿Qué caracteriza a una relación de dependencia cuadrática no lineal?", opts: ["Que el cambio en la variable dependiente varía de forma acelerada ante incrementos uniformes", "Que mantiene una razón constante idéntica a la lineal", "Que genera una línea recta horizontal", "Que su pendiente es cero"], correct: 0, exp: "💡 Explicación: Su comportamiento gráfico no es una línea recta." },
            { q: "[Trimestre 3] ¿Qué indican los criterios de semejanza de triángulos (como LLL o ALA)?", opts: ["Que dos triángulos tienen sus ángulos iguales y sus lados proporcionales aunque difieran en tamaño", "Que son idénticos en área y perímetro exacto", "Que sus hipotenusas miden lo mismo", "Que son figuras tridimensionales"], correct: 0, exp: "💡 Explicación: La semejanza establece proporciones geométricas fijas." },
            { q: "[Trimestre 3] ¿Qué mide específicamente la desviación estándar en estadística avanzada?", opts: ["El grado de dispersión o separación de los datos respecto a su media aritmética", "El valor máximo alcanzado por la muestra", "La frecuencia absoluta acumulada", "La probabilidad de fallo"], correct: 0, exp: "💡 Explicación: Indica qué tan alejados están los datos del promedio." },
            { q: "[Trimestre 3] ¿Cuáles son las soluciones de la ecuación cuadrática pura x² - 9 = 0?", opts: ["x = 3 y x = -3", "x = 9 únicamente", "x = 0", "x = 1"], correct: 0, exp: "💡 Explicación: x² = 9 → x = ±√9 = ±3." }
          ];
        }
      } else {
        // Banco general exclusivo por trimestre para las demás materias
        if (term === "1") {
          pool = [
            { q: `[Trimestre 1] ¿Cuál es el concepto teórico inicial fundamental en ${subject.toUpperCase()}?`, opts: ["Los fundamentos conceptuales y definiciones basales del periodo", "La resolución de problemas avanzados", "El análisis crítico final", "Ninguna anterior"], correct: 0, exp: "💡 Explicación: El primer trimestre introduce los cimientos teóricos de la asignatura." }
          ];
        } else if (term === "2") {
          pool = [
            { q: `[Trimestre 2] ¿Cómo se abordan los procedimientos intermedios en ${subject.toUpperCase()}?`, opts: ["Mediante la aplicación práctica de métodos y casos de estudio intermedios", "Repitiendo únicamente la teoría del trimestre 1", "Sin realizar ejercicios", "Al azar"], correct: 0, exp: "💡 Explicación: El segundo periodo evalúa la aplicación práctica de los conocimientos." }
          ];
        } else {
          pool = [
            { q: `[Trimestre 3] ¿Qué nivel de exigencia evalúa el cierre de curso en ${subject.toUpperCase()}?`, opts: ["Síntesis avanzada, análisis crítico y resolución de problemas complejos", "Ejercicios introductorios básicos", "Memorización simple", "Evaluación opcional"], correct: 0, exp: "💡 Explicación: El tercer trimestre consolida el dominio total de la materia." }
          ];
        }
      }

      // Generar exactamente 50 preguntas únicas combinando las preguntas exclusivas del trimestre seleccionado
      const generated = [];
      for (let i = 1; i <= 50; i++) {
        const baseItem = pool[(i - 1) % pool.length];
        let qText = `Pregunta ${i}: ${baseItem.q}`;
        let expText = baseItem.exp;

        if (i > pool.length) {
          const variantIndex = Math.floor((i - 1) / pool.length);
          qText = `Pregunta ${i} (Variante analítica del Trimestre ${term} - Nivel ${variantIndex + 1}): ${baseItem.q}`;
          expText = `${baseItem.exp} (Refuerzo exclusivo del periodo ${term}).`;
        }

        generated.push({
          id: i,
          expertNote: `Evaluación Exclusiva — Trimestre ${term}`,
          question: qText,
          options: baseItem.options,
          correct: baseItem.correct,
          explanation: expText
        });
      }

      return generated;
    }

    function generate50Questions(grade, subject, term) {
      return getFullBank(grade, subject, term);
    }

    function renderStudyContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjectId = subjectSelect.value;
      const subjectName = subjectSelect.options[subjectSelect.selectedIndex]?.text || subjectId;
      const term = document.getElementById('term-select').value;
      
      document.getElementById('study-title').innerText = `Puntos Clave Científicos: ${subjectName} (${grade}º Grado - ${term}º Trimestre)`;
      const container = document.getElementById('study-content');
      container.innerHTML = '';

      let items = [];
      if (summariesData[grade] && summariesData[grade][subjectId] && summariesData[grade][subjectId][term]) {
        items = summariesData[grade][subjectId][term];
      } else {
        items = [{ topic: `Fundamentos Exclusivos del ${term}º Trimestre`, text: `Temas oficiales clave evaluados específicamente en este periodo para ${subjectName}.` }];
      }

      items.forEach(item => {
        container.innerHTML += `
          <div class="summary-card">
            <h3>📌 ${item.topic}</h3>
            <p>${item.text}</p>
          </div>
        `;
      });
    }

    function renderQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const term = document.getElementById('term-select').value;
      const sampleQ = generate50Questions(grade, subjectId, term)[0];

      document.getElementById('quiz-info').innerHTML = 
        `✨ <strong>${sampleQ.expertNote}</strong> | Preguntas únicas y exclusivas para este trimestre.<br>Al seleccionar tu respuesta, el bloque cambiará a <strong>verde</strong> o <strong>rojo</strong> con explicaciones fundamentadas.`;

      const questions = generate50Questions(grade, subjectId, term);
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      questions.forEach((q, index) => {
        let optsHtml = '';
        q.options.forEach((opt, optIdx) => {
          optsHtml += `
            <li>
              <label class="option-label">
                <input type="radio" name="q${index}" value="${optIdx}" onchange="handleAnswer(${index}, ${q.correct})">
                ${opt}
              </label>
            </li>
          `;
        });

        container.innerHTML += `
          <div class="question-block" id="block-${index}">
            <p class="question-title">${q.question}</p>
            <ul class="options-list">${optsHtml}</ul>
            <div class="explanation" id="exp-${index}">
              ${q.explanation}
            </div>
          </div>
        `;
      });
    }

    function handleAnswer(index, correctIndex) {
      const block = document.getElementById(`block-${index}`);
      const checked = document.querySelector(`input[name="q${index}"]:checked`);
      
      if (!checked) return;

      const userChoice = parseInt(checked.value);
      block.classList.remove('correct-answer', 'wrong-answer');

      setTimeout(() => {
        if (userChoice === correctIndex) {
          block.classList.add('correct-answer');
        } else {
          block.classList.add('wrong-answer');
        }
      }, 500);
    }

    // Lógica del Temporizador de 35 minutos
    let totalSeconds = 35 * 60;
    const timerInterval = setInterval(() => {
      if (totalSeconds > 0) {
        totalSeconds--;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        document.getElementById('time-display').innerText = 
          (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      } else {
        clearInterval(timerInterval);
        document.getElementById('timer-modal').style.display = 'flex';
      }
    }, 1000);

    function handleTimerDecision(action) {
      if (action === 'leave') {
        alert("¡Buen trabajo estudiando hoy! Puedes cerrar la pestaña cuando gustes.");
        window.location.href = "about:blank";
      } else {
        document.getElementById('timer-modal').style.display = 'none';
        totalSeconds = 15 * 60;
      }
    }

    function evaluateQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const term = document.getElementById('term-select').value;
      const questions = generate50Questions(grade, subjectId, term);
      let score = 0;

      questions.forEach((q, index) => {
        const checked = document.querySelector(`input[name="q${index}"]:checked`);
        if (checked && parseInt(checked.value) === q.correct) {
          score++;
        }
      });

      const resDiv = document.getElementById('score-result');
      resDiv.style.display = 'block';
      const pct = (score / 50) * 100;

      if (pct >= 60) {
        resDiv.style.background = 'rgba(34, 197, 94, 0.2)';
        resDiv.style.color = '#86efac';
        resDiv.style.border = '1px solid rgba(34, 197, 94, 0.4)';
        resDiv.innerText = `🎉 ¡Excelente trabajo académico! Obtuviste ${score} de 50 aciertos (${pct}%). ¡Dominaste los temas de este trimestre!`;
      } else {
        resDiv.style.background = 'rgba(239, 68, 68, 0.2)';
        resDiv.style.color = '#fca5a5';
        resDiv.style.border = '1px solid rgba(239, 68, 68, 0.4)';
        resDiv.innerText = `📚 Obtuviste ${score} de 50 aciertos (${pct}%). Revisa las explicaciones y repasa los Puntos Clave exclusivos del trimestre.`;
      }
    }

    function renderAll() {
      renderStudyContent();
      renderQuiz();
      document.getElementById('score-result').style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('study-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('quiz-section').classList.add('active');
      }
    }

    updateSubjectsAndContent();
  </script>
</body>
</html>
