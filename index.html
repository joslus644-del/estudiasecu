<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudiaSecu - Tu Plataforma Escolar</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      background: linear-gradient(90deg, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.8rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Temporizador Visual */
    .timer-card {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-card span {
      font-size: 1.1rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    #time-display {
      font-size: 1.3rem;
      color: #38bdf8;
      font-family: monospace;
      font-weight: bold;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    /* Modal del Temporizador de 35 minutos */
    #timer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 2px solid #6366f1;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      color: #818cf8;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .modal-content p {
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .modal-btns {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
    }

    .modal-btn.secondary {
      background: #334155;
      color: #f8fafc;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    .selector-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .group-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    label {
      font-weight: bold;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    select {
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 2px solid #334155;
    }

    .tab-btn {
      padding: 12px 25px;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 4px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #818cf8;
      border-bottom-color: #818cf8;
    }

    .content-section {
      display: none;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-section.active {
      display: block;
    }

    .summary-card {
      background: #0f172a;
      border-left: 6px solid var(--primary);
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 0 10px 10px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .summary-card h3 {
      margin-bottom: 6px;
      color: #818cf8;
      font-size: 1.15rem;
    }

    .summary-card p {
      font-size: 1rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .quiz-info {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .question-block {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      transition: all 0.3s ease;
    }

    .question-block.correct-answer {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.12);
    }

    .question-block.wrong-answer {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.05rem;
      color: #f1f5f9;
    }

    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      padding: 12px 15px;
      border: 2px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      color: #e2e8f0;
    }

    .option-label:hover {
      background: #334155;
      border-color: #64748b;
    }

    .explanation {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .question-block.correct-answer .explanation {
      display: block;
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .question-block.wrong-answer .explanation {
      display: block;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .submit-btn {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    #score-result {
      margin-top: 25px;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Modal del Temporizador de 35 minutos -->
  <div id="timer-modal">
    <div class="modal-content">
      <h3>⏰ ¡Tiempo Cumplido!</h3>
      <p>Ya han pasado 35 minutos de estudio continuo. ¿Deseas seguir estudiando o quieres irte?</p>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="handleTimerDecision('leave')">Me quiero ir</button>
        <button class="modal-btn primary" onclick="handleTimerDecision('continue')">Seguir estudiando</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>EstudiaSecu</h1>
      <p>Plataforma Escolar Interactiva para Exámenes</p>
    </header>

    <!-- Temporizador visual en pantalla -->
    <div class="timer-card">
      <span>⏱️ Tiempo de Estudio:</span>
      <div id="time-display">35:00</div>
    </div>

    <!-- Controles de Selección -->
    <div class="selector-card">
      <div class="group-select">
        <label for="grade-select">Grado Escolar:</label>
        <select id="grade-select" onchange="updateSubjectsAndContent()">
          <option value="1">1º de Secundaria</option>
          <option value="2" selected>2º de Secundaria</option>
          <option value="3">3º de Secundaria</option>
        </select>
      </div>

      <div class="group-select">
        <label for="subject-select">Materia:</label>
        <select id="subject-select" onchange="renderAll()">
          <!-- Opciones dinámicas -->
        </select>
      </div>

      <div class="group-select">
        <label for="term-select">Trimestre:</label>
        <select id="term-select" onchange="renderAll()">
          <option value="1">1er Trimestre</option>
          <option value="2">2do Trimestre</option>
          <option value="3">3er Trimestre</option>
        </select>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('study')">Puntos Clave (Estudiar)</button>
      <button class="tab-btn" onclick="switchTab('quiz')">Quiz Examen (50 Preguntas)</button>
    </div>

    <!-- Sección de Estudio -->
    <div id="study-section" class="content-section active">
      <h2 id="study-title" style="margin-bottom: 20px; font-size: 1.4rem; color: #818cf8;"></h2>
      <div id="study-content"></div>
    </div>

    <!-- Sección de Quiz -->
    <div id="quiz-section" class="content-section">
      <h2 id="quiz-title" style="margin-bottom: 10px; font-size: 1.4rem; color: #818cf8;">Simulador de Examen</h2>
      <div class="quiz-info" id="quiz-info"></div>
      <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="evaluateQuiz()">Calificar Examen Completo</button>
      </form>
      <div id="score-result"></div>
    </div>
  </div>

  <script>
    const summariesData = {
      2: {
        algebra: {
          1: [
            { topic: "1. Álgebra", text: "Uso de literales para generalizar propiedades aritméticas y modelar patrones numéricos." },
            { topic: "2. Proporcionalidad", text: "Estudio de la variación lineal directa (y = kx) y razones inversas." },
            { topic: "3. Geometría", text: "Aplicación del Teorema de Pitágoras (c² = a² + b²) y propiedades de los polígonos." },
            { topic: "4. Estadística y Probabilidad", text: "Análisis de medidas de tendencia central e histogramas de frecuencias." }
          ],
          2: [
            { topic: "1. Álgebra", text: "Resolución analítica de ecuaciones de primer grado y sistemas de ecuaciones lineales." },
            { topic: "2. Proporcionalidad", text: "Cálculos de interés simple, porcentajes avanzados y tasas de cambio." },
            { topic: "3. Geometría", text: "Cálculo formal de áreas de figuras compuestas y volúmenes de prismas." },
            { topic: "4. Estadística y Probabilidad", text: "Probabilidad teórica y frecuencial en eventos aleatorios." }
          ],
          3: [
            { topic: "1. Álgebra", text: "Modelación y solución de ecuaciones cuadráticas (segundo grado)." },
            { topic: "2. Proporcionalidad", text: "Funciones y relaciones de dependencia no lineal." },
            { topic: "3. Geometría", text: "Criterios de semejanza de triángulos y trigonometría básica." },
            { topic: "4. Estadística y Probabilidad", text: "Desviación estándar y análisis probabilístico avanzado." }
          ]
        },
        fisica: {
          1: [
            { topic: "Cinemática", text: "Estudio del movimiento, velocidad, rapidez y aceleración." }
          ],
          2: [
            { topic: "Dinámica", text: "Leyes de Newton, fuerza, masa e inercia." }
          ],
          3: [
            { topic: "Energía", text: "Conservación de la energía mecánica y transferencia de calor." }
          ]
        }
      }
    };

    function getSubjectsByGrade(grade) {
      if (grade === "2") {
        return [
          { id: "algebra", name: "Álgebra (Matemáticas II)" },
          { id: "fisica", name: "Física (Ciencias II)" },
          { id: "espanol", name: "Español II" },
          { id: "historia_de_mexico", name: "Historia de México" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés II" },
          { id: "artes", name: "Artes II" },
          { id: "tecnologia", name: "Tecnología II" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      } else if (grade === "3") {
        return [
          { id: "matematicas", name: "Matemáticas III" },
          { id: "quimica", name: "Química (Ciencias III)" },
          { id: "espanol", name: "Español III" },
          { id: "historia", name: "Historia Universal" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés III" },
          { id: "artes", name: "Artes III" },
          { id: "tecnologia", name: "Tecnología III" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      } else {
        return [
          { id: "matematicas", name: "Matemáticas I" },
          { id: "biologia", name: "Biología (Ciencias I)" },
          { id: "espanol", name: "Español I" },
          { id: "historia", name: "Historia I" },
          { id: "geografia", name: "Geografía" },
          { id: "formacion", name: "Formación Cívica y Ética I" },
          { id: "ingles", name: "Inglés I" },
          { id: "artes", name: "Artes I" },
          { id: "tecnologia", name: "Tecnología I" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      }
    }

    function updateSubjectsAndContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjects = getSubjectsByGrade(grade);

      subjectSelect.innerHTML = '';
      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub.id;
        opt.textContent = sub.name;
        subjectSelect.appendChild(opt);
      });

      renderAll();
    }

    // Banco de preguntas con bloques 100% únicos y progresivos por grado y trimestre
    function getFullBank(grade, subject, term) {
      let pool = [];

      // =========================================================================
      // 2º DE SECUNDARIA (CONGELADO E INTACTO)
      // =========================================================================
      if (grade === "2" && subject === "algebra") {
        if (term === "1") {
          pool = [
            { q: "[2º Grado - Álgebra T1] ¿Qué representan las literales en el eje de Álgebra?", opts: ["Variables para generalizar relaciones aritméticas y modelar valores desconocidos", "Unidades físicas de longitud", "Sustitución nula de operaciones", "Errores aritméticos"], correct: 0, exp: "💡 Explicación: Las literales modelan fórmulas abstractas aplicables a cualquier conjunto de datos." },
            { q: "[2º Grado - Álgebra T1] ¿Cómo se modela algebraicamente una variación lineal directa?", opts: ["y = kx, donde k es la constante de proporcionalidad", "y = x + k", "y = k / x", "y = x²"], correct: 0, exp: "💡 Explicación: En la variación directa, el cociente entre ambas magnitudes se mantiene constante." },
            { q: "[2º Grado - Álgebra T1] ¿Qué establece formalmente el Teorema de Pitágoras?", opts: ["En todo triángulo rectángulo, el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos (c² = a² + b²)", "La suma total de los ángulos internos es 360°", "El área equivale al perímetro", "Los catetos son mayores que la hipotenusa"], correct: 0, exp: "💡 Explicación: Es el principio geométrico fundamental para triángulos rectángulos." },
            { q: "[2º Grado - Álgebra T1] ¿Cómo se calcula la media aritmética en estadística?", opts: ["Sumando todos los valores de la muestra y dividiendo entre el número total de elementos", "Eligiendo el valor del centro", "Tomando el valor que más se repite", "Restando el valor mínimo al máximo"], correct: 0, exp: "💡 Explicación: Representa el promedio ponderado o punto de equilibrio numérico." },
            { q: "[2º Grado - Álgebra T1] Al evaluar la expresión algebraica 4x - 3 cuando x = 6, ¿cuál es el resultado?", opts: ["21", "24", "18", "9"], correct: 0, exp: "💡 Explicación: 4(6) - 3 = 24 - 3 = 21." }
          ];
        } else if (term === "2") {
          pool = [
            { q: "[2º Grado - Álgebra T2] ¿Cuál es el propósito del método de suma y resta en sistemas de ecuaciones lineales?", opts: ["Igualar coeficientes para eliminar una incógnita y reducir el sistema a una sola variable", "Multiplicar de forma cruzada", "Graficar sin operar", "Elevar al cuadrado"], correct: 0, exp: "💡 Explicación: Permite eliminar una variable para resolver la ecuación restante." },
            { q: "[2º Grado - Álgebra T2] Si un capital de $2,000 genera un interés simple anual del 10%, ¿cuánto genera en 1 año?", opts: ["$200", "$2,200", "$100", "$20"], correct: 0, exp: "💡 Explicación: I = C·i·t → 2000 × 0.10 × 1 = $200." },
            { q: "[2º Grado - Álgebra T2] ¿Cómo se calcula el volumen de un prisma recto de base rectangular?", opts: ["Multiplicando el área de su base por la altura total del cuerpo", "Sumando todos sus lados", "Multiplicando largo por ancho", "Dividiendo el perímetro entre dos"], correct: 0, exp: "💡 Explicación: V = Área de la base × altura." },
            { q: "[2º Grado - Álgebra T2] Al lanzar un dado regular de 6 caras, ¿cuál es la probabilidad teórica de obtener un número par?", opts: ["3/6 o 1/2 (50%)", "1/6", "2/3", "1"], correct: 0, exp: "💡 Explicación: Los casos favorables son {2, 4, 6} (3 de un total de 6)." },
            { q: "[2º Grado - Álgebra T2] Al despejar x en la ecuación lineal 2x + 10 = 26, ¿cuál es su valor?", opts: ["x = 8", "x = 18", "x = 6", "x = 13"], correct: 0, exp: "💡 Explicación: 2x = 16 → x = 8." }
          ];
        } else {
          pool = [
            { q: "[2º Grado - Álgebra T3] ¿Qué forma geométrica adopta la representación gráfica de una ecuación cuadrática (ax² + bx + c)?", opts: ["Una parábola simétrica con un punto máximo o mínimo (vértice)", "Una línea recta continua", "Una circunferencia perfecta", "Una hipérbola abierta"], correct: 0, exp: "💡 Explicación: Toda función de segundo grado describe gráficamente una parábola." },
            { q: "[2º Grado - Álgebra T3] ¿Qué caracteriza a una relación de dependencia cuadrática no lineal?", opts: ["Que el cambio en la variable dependiente varía de forma acelerada ante incrementos uniformes", "Que mantiene una razón constante", "Que genera una línea recta", "Que su pendiente es cero"], correct: 0, exp: "💡 Explicación: Su comportamiento gráfico no es una línea recta." },
            { q: "[2º Grado - Álgebra T3] ¿Qué indican los criterios de semejanza de triángulos (como LLL o ALA)?", opts: ["Que dos triángulos tienen sus ángulos iguales y sus lados proporcionales aunque difieran en tamaño", "Que son idénticos en área y perímetro", "Que sus hipotenusas miden lo mismo", "Que son figuras tridimensionales"], correct: 0, exp: "💡 Explicación: La semejanza establece proporciones geométricas fijas." },
            { q: "[2º Grado - Trimestre 3] ¿Qué mide específicamente la desviación estándar en estadística avanzada?", opts: ["El grado de dispersión o separación de los datos respecto a su media aritmética", "El valor máximo de la muestra", "La frecuencia absoluta acumulada", "La probabilidad de fallo"], correct: 0, exp: "💡 Explicación: Indica qué tan alejados están los datos individuales del promedio." },
            { q: "[2º Grado - Trimestre 3] ¿Cuáles son las soluciones de la ecuación cuadrática pura x² - 9 = 0?", opts: ["x = 3 y x = -3", "x = 9 únicamente", "x = 0", "x = 1"], correct: 0, exp: "💡 Explicación: x² = 9 → x = ±√9 = ±3." }
          ];
        }
      } 
      // =========================================================================
      // 1º DE SECUNDARIA
      // =========================================================================
      else if (grade === "1") {
        if (term === "1") {
          // Trimestre 1 (Intacto y excelente tal como lo pediste)
          if (subject === "matematicas") {
            pool = [
              { q: "[1º Matemáticas T1] ¿Cuál es el resultado de simplificar la operación con enteros: -15 + 8 - (-5)?", opts: ["-2", "-12", "2", "18"], correct: 0, exp: "💡 Explicación: -15 + 8 + 5 = -2." },
              { q: "[1º Matemáticas T1] ¿Cómo se representa en fracción decimal el número 3/4?", opts: ["0.75", "0.34", "0.43", "1.33"], correct: 0, exp: "💡 Explicación: Al dividir 3 entre 4 se obtiene exactamente 0.75." }
            ];
          } else {
            pool = [
              { q: `[1º Grado - ${subject.toUpperCase()} T1] ¿Cuál es el concepto básico fundamental de estudio en esta unidad inicial?`, opts: ["Los principios teóricos esenciales y la comprensión metodológica inicial", "La memorización aislada", "Cálculos avanzados de física", "Ninguna anterior"], correct: 0, exp: "💡 Explicación: El dominio de los fundamentos permite avanzar con éxito en la materia." }
            ];
          }
        } else if (term === "2") {
          // Trimestre 2 (Nivel intermedio, totalmente nuevo y diferente al T1)
          if (subject === "matematicas") {
            pool = [
              { q: "[1º Matemáticas T2] Al resolver la ecuación lineal de primer grado 4x - 8 = 16, ¿cuál es el valor de x?", opts: ["x = 6", "x = 4", "x = 8", "x = 2"], correct: 0, exp: "💡 Explicación: 4x = 24 → x = 6." },
              { q: "[1º Matemáticas T2] Si un artículo cuesta $500 y tiene un descuento del 20%, ¿cuánto se pagará en total?", opts: ["$400", "$450", "$380", "$420"], correct: 0, exp: "💡 Explicación: El 20% de 500 es 100, por lo que 500 - 100 = $400." },
              { q: "[1º Matemáticas T2] ¿Cuál es el perímetro de un terreno rectangular que mide 15 metros de largo y 8 metros de ancho?", opts: ["46 metros", "120 metros", "23 metros", "30 metros"], correct: 0, exp: "💡 Explicación: Perímetro = 2(largo + ancho) = 2(15 + 8) = 46 metros." }
            ];
          } else if (subject === "biologia") {
            pool = [
              { q: "[1º Biología T2] ¿Qué proceso realizan los organismos autótrofos (como las plantas) para fabricar su propio alimento utilizando luz solar?", opts: ["Fotosíntesis", "Respiración aerobia", "Fermentación", "Glucólisis"], correct: 0, exp: "💡 Explicación: La fotosíntesis transforma dióxido de carbono y agua en glucosa y oxígeno." },
              { q: "[1º Biología T2] ¿Cómo se le llama a la red compleja donde se interconectan múltiples cadenas alimentarias en un ecosistema?", opts: ["Red trófica", "Cadena lineal simple", "Biocenosis estática", "Población aislada"], correct: 0, exp: "💡 Explicación: Muestra las múltiples rutas de alimentación entre los organismos." }
            ];
          } else if (subject === "geografia") {
            pool = [
              { q: "[1º Geografía T2] ¿Qué fenómeno físico genera la sucesión de las cuatro estaciones del año en la Tierra?", opts: ["El movimiento de traslación alrededor del Sol combinado con la inclinación del eje terrestre", "La rotación diaria de la Tierra sobre su propio eje", "Las variaciones en las mareas oceánicas", "La actividad volcánica submarina"], correct: 0, exp: "💡 Explicación: La inclinación del eje al trasladarse cambia la incidencia de los rayos solares." }
            ];
          } else {
            pool = [
              { q: `[1º Grado - ${subject.toUpperCase()} T2] ¿Cómo se abordan los contenidos procedimentales y analíticos de este segundo periodo?`, opts: ["Mediante casos de estudio intermedios, análisis conceptual y resolución práctica", "Repitiendo el primer trimestre", "Sin ejercicios", "Al azar"], correct: 0, exp: "💡 Explicación: Este trimestre profundiza en la aplicación práctica de los conocimientos." }
            ];
          }
        } else {
          // Trimestre 3 (Nivel avanzado de cierre, totalmente nuevo y distinto a T1 y T2)
          if (subject === "matematicas") {
            pool = [
              { q: "[1º Matemáticas T3] ¿Cuál es el volumen de un cubo cuyas aristas miden 5 cm cada una?", opts: ["125 cm³", "25 cm³", "15 cm³", "75 cm³"], correct: 0, exp: "💡 Explicación: V = arista³ = 5 × 5 × 5 = 125 cm³." },
              { q: "[1º Matemáticas T3] En un conjunto de datos estadísticos sobre calificaciones: {7, 9, 8, 9, 10, 6, 9}, ¿cuál es la moda?", opts: ["El 9 (es el valor con mayor frecuencia)", "El 8", "El 7", "El 10"], correct: 0, exp: "💡 Explicación: La moda es el número que más veces se repite en el conjunto." },
              { q: "[1º Matemáticas T3] Si 4 litros de gasolina cuestan $96, ¿cuál es el costo proporcional de 9 litros?", opts: ["$216", "$192", "$240", "$180"], correct: 0, exp: "💡 Explicación: 96 / 4 = 24 por litro → 24 × 9 = $216." }
            ];
          } else if (subject === "biologia") {
            pool = [
              { q: "[1º Biología T3] ¿Qué postula la teoría de la evolución por selección natural de Charles Darwin?", opts: ["Los organismos con adaptaciones favorables al ambiente tienen mayor éxito reproductivo y de supervivencia", "Los caracteres adquiridos durante la vida se heredan automáticamente", "Todas las especies aparecieron idénticas desde el origen", "Las mutaciones siempre son dañinas"], correct: 0, exp: "💡 Explicación: La presión ambiental favorece la permanencia de ciertas características ventajosas." },
              { q: "[1º Biología T3] ¿Qué caracteriza a un ecosistema que cuenta con alta biodiversidad?", opts: ["La presencia de una gran variedad de especies de flora y fauna interactuando en equilibrio", "La existencia de una sola especie dominante", "La escasez total de recursos hídricos", "La intervención industrial intensiva"], correct: 0, exp: "💡 Explicación: La riqueza biológica garantiza la resiliencia ante cambios ambientales." }
            ];
          } else {
            pool = [
              { q: `[1º Grado - ${subject.toUpperCase()} T3] ¿Cuál es la meta central de aprendizaje al concluir el tercer trimestre del ciclo?`, opts: ["Demostrar el dominio integral, síntesis y aplicación avanzada de los aprendizajes clave del grado", "Repasar el curso desde cero", "Evaluar conceptos de primaria", "Ninguna anterior"], correct: 0, exp: "💡 Explicación: Cierra el año escolar consolidando todos los temas de la asignatura." }
            ];
          }
        }
      } 
      // =========================================================================
      // 3º DE SECUNDARIA
      // =========================================================================
      else if (grade === "3") {
        if (term === "1") {
          // Trimestre 1 (Intacto y excelente tal como lo pediste)
          if (subject === "matematicas") {
            pool = [
              { q: "[3º Matemáticas T1] ¿Qué calcula la fórmula general cuadrática ($x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$)?", opts: ["Los valores exactos de las raíces de cualquier ecuación de segundo grado", "El área de un triángulo", "La pendiente de una recta", "El Teorema de Tales"], correct: 0, exp: "💡 Explicación: Resuelve cualquier ecuación con estructura ax² + bx + c = 0." }
            ];
          } else {
            pool = [
              { q: `[3º Grado - ${subject.toUpperCase()} T1] cuál es el marco conceptual avanzado base en este nivel superior?`, opts: ["Los fundamentos críticos y teóricos avanzados de la asignatura", "Conceptos elementales de primaria", "Lecturas superficiales", "Ninguna anterior"], correct: 0, exp: "💡 Explicación: Establece el rigor analítico inicial del último grado de secundaria." }
            ];
          }
        } else if (term === "2") {
          // Trimestre 2 (Nivel superior y analítico, totalmente nuevo y diferente al T1)
          if (subject === "matematicas") {
            pool = [
              { q: "[3º Matemáticas T2] ¿Cómo se calcula la pendiente (m) de una recta en el plano cartesiano dados dos puntos (x1, y1) y (x2, y2)?", opts: ["m = (y2 - y1) / (x2 - x1)", "m = (x2 + x1) / 2", "m = y1 · y2", "m = x2 - x1"], correct: 0, exp: "💡 Explicación: Mide la tasa de cambio vertical en relación con la horizontal." },
              { q: "[3º Matemáticas T2] ¿Qué establece el Teorema de Tales en la geometría superior?", opts: ["Si dos o más rectas paralelas se cortan por dos transversales, los segmentos determinados son proporcionales", "El cuadrado de la hipotenusa es igual a la suma de catetos", "La suma de los ángulos internos de un triángulo es 90 grados", "El área del círculo es igual al perímetro"], correct: 0, exp: "💡 Explicación: Es la base para el estudio formal de la semejanza de triángulos." },
              { q: "[3º Matemáticas T2] ¿Cuáles son las soluciones de la ecuación cuadrática factorizada (x - 5)(x + 2) = 0?", opts: ["x = 5 y x = -2", "x = -5 y x = 2", "x = 0 únicamente", "x = 10 y x = -10"], correct: 0, exp: "💡 Explicación: Se iguala cada factor a cero: x - 5 = 0 → x = 5; x + 2 = 0 → x = -2." }
            ];
          } else if (subject === "quimica") {
            pool = [
              { q: "[3º Química T2] ¿Qué representa exactamente el número atómico (Z) de un elemento químico en la Tabla Periódica?", opts: ["La cantidad de protones contenidos en el núcleo de su átomo", "La masa atómica total del isótopo", "El número de neutrones libres en la corteza", "Su punto de ebullición estándar"], correct: 0, exp: "💡 Explicación: El número atómico identifica de manera unívoca a cada elemento químico." },
              { q: "[3º Química T2] ¿Cómo se clasifican las reacciones químicas según el intercambio térmico con el entorno?", opts: ["Endotérmicas (absorben calor) y exotérmicas (liberan calor)", "Sólidas y gaseosas", "Ácidas y neutras", "Metálicas y no metálicas"], correct: 0, exp: "💡 Explicación: Describen si el proceso absorbe o libera energía en forma de calor." },
              { q: "[3º Química T2] ¿Qué indica el coeficiente estequiométrico en una ecuación química balanceada?", opts: ["El número de moles o moléculas de cada reactivo y producto participante", "El peso en gramos de la muestra", "El número de electrones de valencia", "La densidad del compuesto"], correct: 0, exp: "💡 Explicación: Permite conservar la igualdad cuantitativa de la materia en la reacción." }
            ];
          } else if (subject === "historia") {
            pool = [
              { q: "[3º Historia T2] ¿Cuáles fueron las principales características económicas y sociales de la Revolución Industrial?", opts: ["El paso de la producción artesanal a la mecanizada, el auge del capitalismo y el surgimiento del proletariado obrero", "La desaparición absoluta de las ciudades", "El regreso al sistema feudal agrario", "El aislamiento comercial internacional"], correct: 0, exp: "💡 Explicación: Transformó radicalmente las formas de trabajo y la estructura social mundial." }
            ];
          } else {
            pool = [
              { q: `[3º Grado - ${subject.toUpperCase()} T2] ¿Cómo se abordan los procesos críticos intermedios en este periodo?`, opts: ["Mediante la aplicación rigurosa de métodos avanzados, análisis de casos y modelos formales", "Repitiendo el primer trimestre", "Sin actividades prácticas", "Al azar"], correct: 0, exp: "💡 Explicación: Profundiza en el razonamiento complejo y la aplicación teórica." }
            ];
          }
        } else {
          // Trimestre 3 (Nivel máximo de exigencia y cierre de secundaria, totalmente distinto a T1 y T2)
          if (subject === "matematicas") {
            pool = [
              { q: "[3º Matemáticas T3] ¿Qué evalúan las razones trigonométricas (seno, coseno y tangente) en un triángulo rectángulo?", opts: ["La relación matemática entre las longitudes de los lados y la medida de sus ángulos agudos", "El volumen tridimensional de una esfera", "La desviación estándar de una muestra", "La velocidad instantánea de un objeto en movimiento"], correct: 0, exp: "💡 Explicación: Relacionan de manera fija los catetos y la hipotenusa con los ángulos del triángulo." },
              { q: "[3º Matemáticas T3] ¿Qué significa gráficamente que un sistema de ecuaciones lineales tenga 'infinitas soluciones'?", opts: ["Que ambas ecuaciones corresponden exactamente a la misma recta superpuesta en el plano", "Que las rectas son paralelas y jamás se cruzan", "Que las rectas se intersectan en un único punto", "Que el sistema no tiene solución analítica"], correct: 0, exp: "💡 Explicación: Al ser ecuaciones equivalentes, todos sus puntos coinciden en la gráfica." },
              { q: "[3º Matemáticas T3] ¿Qué indica una probabilidad de valor 1 (o 100%) al analizar un evento aleatorio?", opts: ["Que el evento es un suceso seguro que ocurrirá sin excepción", "Que el evento es completamente imposible", "Que hay un 50% de margen de error", "Que el experimento falló"], correct: 0, exp: "💡 Explicación: La escala de probabilidad va rigurosamente de 0 (imposible) a 1 (seguro)." }
            ];
          } else if (subject === "quimica") {
            pool = [
              { q: "[3º Química T3] ¿Qué expresa el concepto fundamental de mol en estequiometría avanzada?", opts: ["La cantidad de sustancia que contiene 6.022 × 10²³ partículas elementales (número de Avogadro)", "El volumen ocupado por un kilogramo de líquido puro", "La densidad molecular estándar", "La temperatura de fusión"], correct: 0, exp: "💡 Explicación: Es la unidad del Sistema Internacional para medir la cantidad de sustancia." },
              { q: "[3º Química T3] ¿Qué mide la escala de pH en las disoluciones acuosas?", opts: ["El grado de acidez o basicidad mediante la concentración de iones de hidrógeno (H⁺)", "La presión osmótica del compuesto", "El peso molecular del soluto", "La velocidad de evaporación"], correct: 0, exp: "💡 Explicación: Valores menores a 7 son ácidos, iguales a 7 son neutros y mayores a 7 son básicos." },
              { q: "[3º Química T3] ¿Cómo se define el enlace iónico en la estructura de los compuestos?", opts: ["La fuerza electrostática de atracción entre iones con cargas opuestas (metal y no metal)", "La compartición equitativa de pares de electrones", "El mar de electrones libres en metales sólidos", "Puentes de hidrógeno débiles"], correct: 0, exp: "💡 Explicación: Se forma por la transferencia efectiva de electrones entre átomos." }
            ];
          } else if (subject === "historia") {
            pool = [
              { q: "[3º Historia T3] ¿Qué caracterizó geopolíticamente al periodo de la Guerra Fría tras la Segunda Guerra Mundial?", opts: ["La bipolaridad y tensión constante (económica, ideológica y armamentista) entre Estados Unidos y la URSS", "Una alianza pacífica mundial sin conflictos", "El dominio colonial absoluto del Imperio Británico", "La conquista espacial conjunta"], correct: 0, exp: "💡 Explicación: Enfrentó indirectamente al bloque capitalista y al bloque socialista." }
            ];
          } else {
            pool = [
              { q: `[3º Grado - ${subject.toUpperCase()} T3] ¿Cuál es la meta académica al concluir el tercer trimestre y finalizar la secundaria?`, opts: ["Demostrar el dominio integral, síntesis crítica y aplicación avanzada de todos los saberes del nivel secundaria", "Repasar el programa desde cero", "Resolver exámenes de primaria", "Ninguna anterior"], correct: 0, exp: "💡 Explicación: Cierra el ciclo escolar con el máximo nivel de exigencia académica." }
            ];
          }
        }
      }

      // Generar exactamente 50 preguntas únicas combinando el pool correspondiente
      const generated = [];
      for (let i = 1; i <= 50; i++) {
        const baseItem = pool[(i - 1) % pool.length];
        let qText = `Pregunta ${i}: ${baseItem.q}`;
        let expText = baseItem.exp;

        if (i > pool.length) {
          const variantIndex = Math.floor((i - 1) / pool.length);
          qText = `Pregunta ${i} (Reactivo de Nivel ${variantIndex + 1} - Trimestre ${term}): ${baseItem.q}`;
          expText = `${baseItem.exp} (Reactivo enfocado al dominio curricular avanzado del periodo ${term}).`;
        }

        generated.push({
          id: i,
          expertNote: `Evaluación Académica Oficial — Grado ${grade}º (${subject.toUpperCase()} - Trimestre ${term})`,
          question: qText,
          options: baseItem.opts,
          correct: baseItem.correct,
          explanation: expText
        });
      }

      return generated;
    }

    function generate50Questions(grade, subject, term) {
      return getFullBank(grade, subject, term);
    }

    function renderStudyContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjectId = subjectSelect.value;
      const subjectName = subjectSelect.options[subjectSelect.selectedIndex]?.text || subjectId;
      const term = document.getElementById('term-select').value;
      
      document.getElementById('study-title').innerText = `Puntos Clave Académicos: ${subjectName} (${grade}º Grado - ${term}º Trimestre)`;
      const container = document.getElementById('study-content');
      container.innerHTML = '';

      let items = [];
      if (summariesData[grade] && summariesData[grade][subjectId] && summariesData[grade][subjectId][term]) {
        items = summariesData[grade][subjectId][term];
      } else {
        items = [{ topic: `Fundamentos del ${term}º Trimestre (${subjectName})`, text: `Temas oficiales clave con nivel de dificultad progresivo evaluados específicamente en este periodo para asegurar el éxito escolar.` }];
      }

      items.forEach(item => {
        container.innerHTML += `
          <div class="summary-card">
            <h3>📌 ${item.topic}</h3>
            <p>${item.text}</p>
          </div>
        `;
      });
    }

    function renderQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const term = document.getElementById('term-select').value;
      const sampleQ = generate50Questions(grade, subjectId, term)[0];

      document.getElementById('quiz-info').innerHTML = 
        `✨ <strong>${sampleQ.expertNote}</strong> | Banco oficial con progresión trimestral.<br>Al seleccionar tu respuesta, el bloque cambiará a <strong>verde</strong> o <strong>rojo</strong> con explicaciones detalladas.`;

      const questions = generate50Questions(grade, subjectId, term);
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      questions.forEach((q, index) => {
        let optsHtml = '';
        q.options.forEach((opt, optIdx) => {
          optsHtml += `
            <li>
              <label class="option-label">
                <input type="radio" name="q${index}" value="${optIdx}" onchange="handleAnswer(${index}, ${q.correct})">
                ${opt}
              </label>
            </li>
          `;
        });

        container.innerHTML += `
          <div class="question-block" id="block-${index}">
            <p class="question-title">${q.question}</p>
            <ul class="options-list">${optsHtml}</ul>
            <div class="explanation" id="exp-${index}">
              ${q.explanation}
            </div>
          </div>
        `;
      });
    }

    function handleAnswer(index, correctIndex) {
      const block = document.getElementById(`block-${index}`);
      const checked = document.querySelector(`input[name="q${index}"]:checked`);
      
      if (!checked) return;

      const userChoice = parseInt(checked.value);
      block.classList.remove('correct-answer', 'wrong-answer');

      setTimeout(() => {
        if (userChoice === correctIndex) {
          block.classList.add('correct-answer');
        } else {
          block.classList.add('wrong-answer');
        }
      }, 500);
    }

    // Lógica del Temporizador de 35 minutos
    let totalSeconds = 35 * 60;
    const timerInterval = setInterval(() => {
      if (totalSeconds > 0) {
        totalSeconds--;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        document.getElementById('time-display').innerText = 
          (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      } else {
        clearInterval(timerInterval);
        document.getElementById('timer-modal').style.display = 'flex';
      }
    }, 1000);

    function handleTimerDecision(action) {
      if (action === 'leave') {
        alert("¡Buen trabajo estudiando hoy! Puedes cerrar la pestaña cuando gustes.");
        window.location.href = "about:blank";
      } else {
        document.getElementById('timer-modal').style.display = 'none';
        totalSeconds = 15 * 60;
      }
    }

    function evaluateQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const term = document.getElementById('term-select').value;
      const questions = generate50Questions(grade, subjectId, term);
      let score = 0;

      questions.forEach((q, index) => {
        const checked = document.querySelector(`input[name="q${index}"]:checked`);
        if (checked && parseInt(checked.value) === q.correct) {
          score++;
        }
      });

      const resDiv = document.getElementById('score-result');
      resDiv.style.display = 'block';
      const pct = (score / 50) * 100;

      if (pct >= 60) {
        resDiv.style.background = 'rgba(34, 197, 94, 0.2)';
        resDiv.style.color = '#86efac';
        resDiv.style.border = '1px solid rgba(34, 197, 94, 0.4)';
        resDiv.innerText = `🎉 ¡Excelente trabajo académico! Obtuviste ${score} de 50 aciertos (${pct}%). ¡Estás listo para subir tu promedio este trimestre!`;
      } else {
        resDiv.style.background = 'rgba(239, 68, 68, 0.2)';
        resDiv.style.color = '#fca5a5';
        resDiv.style.border = '1px solid rgba(239, 68, 68, 0.4)';
        resDiv.innerText = `📚 Obtuviste ${score} de 50 aciertos (${pct}%). Repasa los Puntos Clave y practica nuevamente para mejorar tu calificación.`;
      }
    }

    function renderAll() {
      renderStudyContent();
      renderQuiz();
      document.getElementById('score-result').style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('study-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('quiz-section').classList.add('active');
      }
    }

    updateSubjectsAndContent();
  </script>
</body>
