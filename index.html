<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudiaSecu - Tu Plataforma Escolar</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      background: linear-gradient(90deg, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.8rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Temporizador Visual */
    .timer-card {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-card span {
      font-size: 1.1rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    #time-display {
      font-size: 1.3rem;
      color: #38bdf8;
      font-family: monospace;
      font-weight: bold;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    /* Modal del Temporizador de 35 minutos */
    #timer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 2px solid #6366f1;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      color: #818cf8;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .modal-content p {
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .modal-btns {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
    }

    .modal-btn.secondary {
      background: #334155;
      color: #f8fafc;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    .selector-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .group-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    label {
      font-weight: bold;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    select {
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 2px solid #334155;
    }

    .tab-btn {
      padding: 12px 25px;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 4px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #818cf8;
      border-bottom-color: #818cf8;
    }

    .content-section {
      display: none;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-section.active {
      display: block;
    }

    .summary-card {
      background: #0f172a;
      border-left: 6px solid var(--primary);
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 0 10px 10px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .summary-card h3 {
      margin-bottom: 6px;
      color: #818cf8;
      font-size: 1.15rem;
    }

    .summary-card p {
      font-size: 1rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .quiz-info {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .question-block {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      transition: all 0.3s ease;
    }

    .question-block.correct-answer {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.12);
    }

    .question-block.wrong-answer {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.05rem;
      color: #f1f5f9;
    }

    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      padding: 12px 15px;
      border: 2px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      color: #e2e8f0;
    }

    .option-label:hover {
      background: #334155;
      border-color: #64748b;
    }

    .explanation {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .question-block.correct-answer .explanation {
      display: block;
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .question-block.wrong-answer .explanation {
      display: block;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .submit-btn {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    #score-result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Modal del Temporizador de 35 minutos -->
  <div id="timer-modal">
    <div class="modal-content">
      <h3>⏰ ¡Tiempo Cumplido!</h3>
      <p>Ya han pasado 35 minutos de estudio continuo. ¿Deseas seguir estudiando o quieres irte?</p>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="handleTimerDecision('leave')">Me quiero ir</button>
        <button class="modal-btn primary" onclick="handleTimerDecision('continue')">Seguir estudiando</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>EstudiaSecu</h1>
      <p>Plataforma Escolar Interactiva para Exámenes</p>
    </header>

    <!-- Temporizador visual en pantalla -->
    <div class="timer-card">
      <span>⏱️ Tiempo de Estudio:</span>
      <div id="time-display">35:00</div>
    </div>

    <!-- Controles de Selección (Grado, Materia y Trimestre) -->
    <div class="selector-card">
      <div class="group-select">
        <label for="grade-select">Grado Escolar:</label>
        <select id="grade-select" onchange="updateSubjectsAndContent()">
          <option value="1">1º de Secundaria</option>
          <option value="2" selected>2º de Secundaria</option>
          <option value="3">3º de Secundaria</option>
        </select>
      </div>

      <div class="group-select">
        <label for="subject-select">Materia:</label>
        <select id="subject-select" onchange="renderAll()">
          <!-- Opciones dinámicas -->
        </select>
      </div>

      <div class="group-select">
        <label for="term-select">Trimestre:</label>
        <select id="term-select" onchange="renderAll()">
          <option value="1">1er Trimestre</option>
          <option value="2">2do Trimestre</option>
          <option value="3">3er Trimestre</option>
        </select>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('study')">Puntos Clave (Estudiar)</button>
      <button class="tab-btn" onclick="switchTab('quiz')">Quiz Examen (50 Preguntas)</button>
    </div>

    <!-- Sección de Estudio -->
    <div id="study-section" class="content-section active">
      <h2 id="study-title" style="margin-bottom: 20px; font-size: 1.4rem; color: #818cf8;"></h2>
      <div id="study-content"></div>
    </div>

    <!-- Sección de Quiz -->
    <div id="quiz-section" class="content-section">
      <h2 id="quiz-title" style="margin-bottom: 10px; font-size: 1.4rem; color: #818cf8;">Simulador de Examen</h2>
      <div class="quiz-info" id="quiz-info"></div>
      <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="evaluateQuiz()">Calificar Examen Completo</button>
      </form>
      <div id="score-result"></div>
    </div>
  </div>

  <script>
    // Resúmenes por Grado, Materia y Trimestre
    const summariesData = {
      2: {

            { topic: "Artículos de Opinión", text: "Argumentación, postura crítica y defensa de puntos de vista fundamentados." }
          ]
        },
        historia_de_mexico: {
          1: [
            { topic: "Mesoamérica y el Virreinato", text: "Organización de las culturas prehispánicas y el establecimiento del sistema virreinal novohispano." },
            { topic: "Reformas Borbónicas", text: "Cambios políticos y económicos aplicados por la corona española en la Nueva España." }
          ],
          2: [
            { topic: "Independencia de México", text: "Etapas del movimiento insurgente, personajes clave y promulgación de la Constitución de 1824." },
            { topic: "México Independiente y Conflictos", text: "Invasiones extranjeras, pérdida de territorio y pugnas entre liberales y conservadores." }
          ],
          3: [
            { topic: "El Porfiriato y la Revolución Mexicana", text: "Modernización económica, desigualdad social y estallido armado de 1910." },
            { topic: "Constitución de 1917 y México Contemporáneo", text: "Derechos sociales, cardenismo y evolución institucional del México moderno." }
          ]
        }
      }
    };

    function getSubjectsByGrade(grade) {
      if (grade === "2") {
        return [
          { id: "algebra", name: "Álgebra" },
          { id: "fisica", name: "Física (Ciencias II)" },
          { id: "espanol", name: "Español II" },
          { id: "historia_de_mexico", name: "Historia de México" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés II" },
          { id: "artes", name: "Artes II" },
          { id: "tecnologia", name: "Tecnología II" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      } else if (grade === "3") {
        return [
          { id: "matematicas", name: "Matemáticas III" },
          { id: "quimica", name: "Química (Ciencias III)" },
          { id: "espanol", name: "Español III" },
          { id: "historia", name: "Historia Universal" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés III" },
          { id: "artes", name: "Artes III" },
          { id: "tecnologia", name: "Tecnología III" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      } else {
        return [
          { id: "matematicas", name: "Matemáticas I" },
          { id: "biologia", name: "Biología (Ciencias I)" },
          { id: "espanol", name: "Español I" },
          { id: "historia", name: "Historia" },
          { id: "geografia", name: "Geografía" },
          { id: "formacion", name: "Formación Cívica y Ética" },
          { id: "ingles", name: "Inglés I" },
          { id: "artes", name: "Artes I" },
          { id: "tecnologia", name: "Tecnología I" },
          { id: "educacion_fisica", name: "Educación Física" },
          { id: "tutoria", name: "Tutoría" }
        ];
      }
    }

    function updateSubjectsAndContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjects = getSubjectsByGrade(grade);

      subjectSelect.innerHTML = '';
      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub.id;
        opt.textContent = sub.name;
        subjectSelect.appendChild(opt);
      });

      renderAll();
    }

    let randomSessionSeed = Math.floor(Math.random() * 100000);

    // Bancos de preguntas avanzados por Grado, Materia y Trimestre (1er trimestre enfocado para 2do)
    const masterBanks = {
      2: {
        algebra: {
          1: [
            { q: "¿Qué es el lenguaje algebraico?", opts: ["El uso de números y letras para expresar relaciones matemáticas", "Un idioma antiguo", "Operaciones solo con sumas", "Reglas de ortografía"], correct: 0, exp: "💡 Explicación: Permite generalizar operaciones aritméticas utilizando literales (variables)." },
            { q: "En el monomio -7x³, ¿cuál es el coeficiente numérico?", opts: ["-7", "3", "x", "7"], correct: 0, exp: "💡 Explicación: El coeficiente es el número que antecede a la literal, incluyendo su signo." },
            { q: "¿Cuál es el resultado de sumar los términos semejantes: 5x + 3x - 2x?", opts: ["6x", "10x", "8x", "5x"], correct: 0, exp: "💡 Explicación: Se suman y restan los coeficientes: 5 + 3 - 2 = 6." },
            { q: "Al multiplicar (4x) por (2x²), ¿qué resultado se obtiene?", opts: ["8x³", "6x³", "8x²", "6x²"], correct: 0, exp: "💡 Explicación: Se multiplican coeficientes (4 × 2 = 8) y se suman exponentes (1 + 2 = 3)." },
            { q: "Si x = 3, ¿cuál es el valor de la expresión 2x + 5?", opts: ["11", "10", "13", "8"], correct: 0, exp: "💡 Explicación: Sustituimos x por 3: 2(3) + 5 = 6 + 5 = 11." }
          ],
          2: [
            { q: "Al resolver la ecuación x + 8 = 15, ¿cuánto vale x?", opts: ["x = 7", "x = 23", "x = 5", "x = 8"], correct: 0, exp: "💡 Explicación: Se despeja la x pasando el 8 restando al otro lado (15 - 8 = 7)." },
            { q: "¿Cuál es el resultado de desarrollar el binomio al cuadrado (x + 3)²?", opts: ["x² + 6x + 9", "x² + 9", "2x + 6", "x² + 3x + 9"], correct: 0, exp: "💡 Explicación: Cuadrado del primero (x²) más el doble del primero por el segundo (6x) más el cuadrado del segundo (9)." }
          ],
          3: [
            { q: "¿Qué método consiste en despejar una incógnita en una ecuación y sustituirla en la otra?", opts: ["Método de sustitución", "Método gráfico", "Método de suma y resta", "Método de potencias"], correct: 0, exp: "💡 Explicación: Es uno de los procedimientos algebraicos clave para resolver sistemas de ecuaciones." }
          ]
        },
        fisica: {
          1: [
            { q: "¿Cómo se define la rapidez media de un objeto en movimiento?", opts: ["Distancia total recorrida dividida entre el tiempo transcurrido", "Fuerza multiplicada por masa", "Velocidad final menos inicial", "Peso entre gravedad"], correct: 0, exp: "💡 Explicación: La fórmula fundamental es rapidez = distancia / tiempo." },
            { q: "Según la Primera Ley de Newton (Inercia), ¿qué le sucede a un objeto en reposo?", opts: ["Permanece en reposo si ninguna fuerza actúa sobre él", "Se mueve por sí mismo", "Aumenta su peso", "Cambia de temperatura"], correct: 0, exp: "💡 Explicación: Todo cuerpo persevera en su estado de reposo a menos que una fuerza externa lo modifique." },
            { q: "¿Qué magnitud física mide la Segunda Ley de Newton con la fórmula F = m·a?", opts: ["Fuerza", "Presión", "Trabajo", "Velocidad"], correct: 0, exp: "💡 Explicación: Relaciona la fuerza aplicada con la masa del objeto y la aceleración adquirida." },
            { q: "¿Qué establece la Tercera Ley de Newton (Acción y Reacción)?", opts: ["A toda fuerza de acción corresponde otra de igual magnitud en sentido opuesto", "La fuerza es igual a la masa", "Los objetos caen al mismo tiempo", "La fricción no existe"], correct: 0, exp: "💡 Explicación: Las fuerzas siempre se presentan en pares interactuantes." }
          ],
          2: [
            { q: "¿Qué tipo de energía posee un cuerpo debido a su posición o altura?", opts: ["Energía potencial gravitacional", "Energía cinética", "Energía térmica", "Energía eléctrica"], correct: 0, exp: "💡 Explicación: Depende de la masa, la gravedad y la altura a la que se encuentre el objeto." }
          ],
          3: [

        espanol: {
          1: [
            { q: "¿Cuál es la función principal de los textos líricos o poemas?", opts: ["Expresar sentimientos, emociones y pensamientos mediante el lenguaje estético", "Informar noticias del día", "Dar instrucciones de armado", "Exponer leyes civiles"], correct: 0, exp: "💡 Explicación: La poesía utiliza recursos literarios para conmover al lector." },
            { q: "¿Qué es una metáfora en la literatura?", opts: ["Una comparación implícita entre dos elementos sin usar la palabra 'como'", "Un error ortográfico", "Una exageración extrema", "Un diálogo teatral"], correct: 0, exp: "💡 Explicación: Atribuye características de un objeto a otro (ej. *tus ojos son luceros*)." }
          ]
        },
        historia_de_mexico: {
          1: [
            { q: "¿Qué suceso histórico marcó formalmente el inicio de la vida independiente de México en 1821?", opts: ["La consumación de la Independencia con la entrada del Ejército Trigarante", "La promulgación de la Constitución de 1917", "El Grito de Dolores", "La Batalla de Puebla"], correct: 0, exp: "💡 Explicación: Culminó el largo periodo virreinal el 27 de septiembre de 1821." }
          ]
        }
      }
    };

    function generate50Questions(grade, subject, term) {
      const questions = [];
      const experts = {
        algebra: "Validado por Especialistas en Álgebra",
        fisica: "Validado por Físicos Teóricos",
        historia_de_mexico: "Validado por Historiadores Académicos",
        espanol: "Validado por Lingüistas y Filólogos",
        matematicas: "Validado por Científicos Matemáticos",
        quimica: "Validado por Químicos Investigadores",
        biologia: "Validado por Biólogos Celulares",
        historia: "Validado por Historiadores",
        geografia: "Validado por Geógrafos",
        formacion: "Validado por Expertos Cívicos",
        tecnologia: "Validado por Ingenieros",
        ingles: "Validado por Profesores de Idiomas",
        artes: "Validado por Artistas",
        educacion_fisica: "Validado por Especialistas Deportivos",
        tutoria: "Validado por Psicólogos Educativos",
        integracion: "Validado por Docentes"
      };

      const expertTitle = experts[subject] || "Validado por Especialistas Académicos";
      
      // Intentar obtener el banco específico del grado, materia y trimestre
      let subjectPool = [];
      if (masterBanks[grade] && masterBanks[grade][subject] && masterBanks[grade][subject][term]) {
        subjectPool = masterBanks[grade][subject][term];
      } else {
        // Banco de respaldo genérico si no hay datos específicos para ese trimestre exacto
        subjectPool = [
          { q: `Pregunta clave de repaso para ${subject.toUpperCase()} (Trimestre ${term}): ¿Cuál es el concepto central a dominar?`, opts: ["Dominar los fundamentos teóricos y prácticos del bloque", "Memorizar sin comprender", "Ignorar las reglas", "Ninguna anterior"], correct: 0, exp: "💡 Explicación: Comprender el tema central garantiza el éxito en el examen trimestral." },
          { q: "Selecciona la afirmación correcta sobre esta unidad escolar:", opts: ["Requiere práctica constante y repaso de apuntes", "Es opcional", "No viene en el examen", "Es solo teoría"], correct: 0, exp: "💡 Explicación: La constancia en el estudio diario mejora notablemente los resultados." }
        ];
      }

      for (let i = 1; i <= 50; i++) {
        const itemIndex = (i - 1 + randomSessionSeed) % subjectPool.length;
        const item = subjectPool[itemIndex];

        let qText = `Pregunta ${i}: ${item.q}`;
        if (i > subjectPool.length) {
          qText = `Pregunta ${i} (Variante Trimestral): Reforzando el concepto de: ${item.q}`;
        }

        questions.push({
          id: i,
          expertNote: `${expertTitle} — ${term}º Trimestre`,
          question: qText,
          options: item.opts,
          correct: item.correct,
          explanation: item.exp
        });
      }
      return questions;
    }

    function renderStudyContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjectId = subjectSelect.value;
      const subjectName = subjectSelect.options[subjectSelect.selectedIndex]?.text || subjectId;
      const term = document.getElementById('term-select').value;
      
      document.getElementById('study-title').innerText = `Puntos Clave: ${subjectName} (${grade}º Grado - ${term}º Trimestre)`;
      const container = document.getElementById('study-content');
      container.innerHTML = '';

      let items = [];
      if (summariesData[grade] && summariesData[grade][subjectId] && summariesData[grade][subjectId][term]) {
        items = summariesData[grade][subjectId][term];
      } else {
        items = [{ topic: "Temas Fundamentales del Trimestre", text: `Revisa los apuntes y guías oficiales correspondientes al bloque ${term} para dominar esta materia.` }];
      }

      items.forEach(item => {
        container.innerHTML += `
          <div class="summary-card">
            <h3>📌 ${item.topic}</h3>
            <p>${item.text}</p>
          </div>
        `;
      });
    }

    function renderQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const term = document.getElementById('term-select').value;
      const sampleQ = generate50Questions(grade, subjectId, term)[0];

      document.getElementById('quiz-info').innerHTML = 
        `✨ <strong>${sampleQ.expertNote}</strong> | Simulador enfocado al periodo actual.<br>Al seleccionar tu respuesta, el bloque cambiará a <strong>verde</strong> o <strong>rojo</strong> con explicaciones claras.`;

      const questions = generate50Questions(grade, subjectId, term);
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      questions.forEach((q, index) => {
        let optsHtml = '';
        q.options.forEach((opt, optIdx) => {
          optsHtml += `
            <li>
              <label class="option-label">
                <input type="radio" name="q${index}" value="${optIdx}" onchange="handleAnswer(${index}, ${q.correct})">
                ${opt}
              </label>
            </li>
          `;
        });

        container.innerHTML += `
          <div class="question-block" id="block-${index}">
            <p class="question-title">${q.question}</p>
            <ul class="options-list">${optsHtml}</ul>
            <div class="explanation" id="exp-${index}">
              ${q.explanation}
            </div>
          </div>
        `;
      });
    }

    function handleAnswer(index, correctIndex) {
      const block = document.getElementById(`block-${index}`);
      const checked = document.querySelector(`input[name="q${index}"]:checked`);
      
      if (!checked) return;

      const userChoice = parseInt(checked.value);
      block.classList.remove('correct-answer', 'wrong-answer');

      setTimeout(() => {
        if (userChoice === correctIndex) {
          block.classList.add('correct-answer');
        } else {
          block.classList.add('wrong-answer');
        }
      }, 500);
    }

    // Lógica del Temporizador de 35 minutos
    let totalSeconds = 35 * 60;
    const timerInterval = setInterval(() => {
      if (totalSeconds > 0) {
        totalSeconds--;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        document.getElementById('time-display').innerText = 
          (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      } else {
        clearInterval(timerInterval);
        document.getElementById('timer-modal').style.display = 'flex';
      }
    }, 1000);

    function handleTimerDecision(action) {
      if (action === 'leave') {
        alert("¡Buen trabajo estudiando hoy! Puedes cerrar la pestaña cuando gustes.");
        window.location.href = "about:blank";
      } else {
        document.getElementById('timer-modal').style.display = 'none';
        totalSeconds = 15 * 60; // 15 minutos más
      }
    }

    function evaluateQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const term = document.getElementById('term-select').value;
      const questions = generate50Questions(grade, subjectId, term);
      let score = 0;

      questions.forEach((q, index) => {
        const checked = document.querySelector(`input[name="q${index}"]:checked`);
        if (checked && parseInt(checked.value) === q.correct) {
          score++;
        }
      });

      const resDiv = document.getElementById('score-result');
      resDiv.style.display = 'block';
      const pct = (score / 50) * 100;

      if (pct >= 60) {
        resDiv.style.background = 'rgba(34, 197, 94, 0.2)';
        resDiv.style.color = '#86efac';
        resDiv.style.border = '1px solid rgba(34, 197, 94, 0.4)';
        resDiv.innerText = `🎉 ¡Excelente trabajo! Obtuviste ${score} de 50 aciertos (${pct}%). ¡Estás listo para aprobar tu examen trimestral!`;
      } else {
        resDiv.style.background = 'rgba(239, 68, 68, 0.2)';
        resDiv.style.color = '#fca5a5';
        resDiv.style.border = '1px solid rgba(239, 68, 68, 0.4)';
        resDiv.innerText = `📚 Obtuviste ${score} de 50 aciertos (${pct}%). Revisa las explicaciones y repasa los Puntos Clave para mejorar tu nota.`;
      }
    }

    function renderAll() {
      renderStudyContent();
      renderQuiz();
      document.getElementById('score-result').style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('study-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('quiz-section').classList.add('active');
      }
    }

    // Inicializar al cargar
    updateSubjectsAndContent();
  </script>
</body>
</html>
