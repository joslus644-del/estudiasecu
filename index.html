<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudiaSecu - Plataforma Escolar</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1e1b4b 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            background: linear-gradient(90deg, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .timer {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0;
        }
        .header-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .control-btn {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }
        .control-btn svg {
            stroke: var(--text-light);
            fill: none;
            stroke-width: 2;
        }
        .selector-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .selector-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-muted);
        }
        .selector-group select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            color: var(--text-light);
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .selector-group select:focus {
            border-color: var(--primary);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }
        .topics-container, .exam-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .topic-item {
            margin-bottom: 15px;
        }
        .topic-item h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }
        .topic-item ul {
            list-style-type: none;
            padding-left: 0;
        }
        .topic-item li {
            padding: 5px 0;
            border-bottom: 1px solid #334155;
        }
        .exam-question {
            margin-bottom: 20px;
        }
        .exam-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .exam-option {
            padding: 12px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .exam-option:hover, .exam-option.selected {
            border-color: var(--primary);
            background: #2563eb;
        }
        .exam-option.correct {
            background: #22c55e;
            border-color: #22c55e;
        }
        .exam-option.incorrect {
            background: #ef4444;
            border-color: #ef4444;
        }
        .exam-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .exam-nav button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #334155;
            color: var(--text-light);
            cursor: pointer;
        }
        .exam-nav button:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }
        .exam-submit {
            padding: 10px 20px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .exam-result {
            text-align: center;
            margin-top: 20px;
        }
        .exam-score {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }
        #paused-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            text-align: center;
        }
        .bunny-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--primary);
            max-width: 400px;
        }
        .bunny-emoji {
            font-size: 4rem;
            animation: bounce 1.2s infinite ease-in-out;
            display: inline-block;
            margin-bottom: 20px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        #admin-panel {
            background: #111827;
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        #admin-panel h2 {
            margin-bottom: 15px;
        }
        .admin-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-admin {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-resume {
            background: #3b82f6;
            color: white;
        }
        .btn-pause {
            background: #8b5cf6;
            color: white;
        }
        .visits-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .visits-table th {
            background: #1f2937;
            color: var(--text-muted);
            padding: 10px;
            text-align: left;
        }
        .visits-table td {
            padding: 10px;
            border-bottom: 1px solid #374151;
        }
        #modal-password {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-content h3 {
            margin-bottom: 15px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text-light);
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, var(--primary), #ec4899);
            color: white;
        }
        .modal-btn.secondary {
            background: #334155;
            color: var(--text-light);
        }
    </style>
</head>
