<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudiaSecu - Tu Plataforma Escolar</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      background: linear-gradient(90deg, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.8rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    /* Modal de notificación de actualización */
    #update-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 2px solid #6366f1;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      color: #818cf8;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .modal-content p {
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .modal-btns {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
    }

    .modal-btn.secondary {
      background: #334155;
      color: #f8fafc;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    .selector-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .group-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 250px;
    }

    label {
      font-weight: bold;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    select {
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 2px solid #334155;
    }

    .tab-btn {
      padding: 12px 25px;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 4px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #818cf8;
      border-bottom-color: #818cf8;
    }

    .content-section {
      display: none;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .content-section.active {
      display: block;
    }

    .summary-card {
      background: #0f172a;
      border-left: 6px solid var(--primary);
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 0 10px 10px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .summary-card h3 {
      margin-bottom: 6px;
      color: #818cf8;
      font-size: 1.15rem;
    }

    .summary-card p {
      font-size: 1rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .quiz-info {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .question-block {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      transition: all 0.3s ease;
    }

    .question-block.correct-answer {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.12);
    }

    .question-block.wrong-answer {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.05rem;
      color: #f1f5f9;
    }

    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      padding: 12px 15px;
      border: 2px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      color: #e2e8f0;
    }

    .option-label:hover {
      background: #334155;
      border-color: #64748b;
    }

    .explanation {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .question-block.correct-answer .explanation {
      display: block;
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .question-block.wrong-answer .explanation {
      display: block;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .submit-btn {
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    #score-result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Modal de Actualización al Entrar -->
  <div id="update-modal">
    <div class="modal-content">
      <h3>🔔 Actualizar Contenido</h3>
      <p>¿Deseas actualizar las preguntas de estudio y los quizzes con nuevas variantes esenciales para esta sesión?</p>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="closeModal(false)">Continuar con las actuales</button>
        <button class="modal-btn primary" onclick="closeModal(true)">Sí, Actualizar</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>EstudiaSecu</h1>
      <p>Plataforma Escolar Interactiva para Exámenes</p>
    </header>

    <!-- Controles de Selección -->
    <div class="selector-card">
      <div class="group-select">
        <label for="grade-select">Selecciona tu Grado:</label>
        <select id="grade-select" onchange="updateSubjectsAndContent()">
          <option value="1">1º de Secundaria</option>
          <option value="2">2º de Secundaria</option>
          <option value="3">3º de Secundaria</option>
        </select>
      </div>

      <div class="group-select">
        <label for="subject-select">Selecciona la Materia:</label>
        <select id="subject-select" onchange="renderAll()">
          <!-- Opciones de materias -->
        </select>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('study')">Puntos Clave (Estudiar)</button>
      <button class="tab-btn" onclick="switchTab('quiz')">Quiz Examen (50 Preguntas)</button>
    </div>

    <!-- Sección de Estudio -->
    <div id="study-section" class="content-section active">
      <h2 id="study-title" style="margin-bottom: 20px; font-size: 1.4rem; color: #818cf8;"></h2>
      <div id="study-content"></div>
    </div>

    <!-- Sección de Quiz -->
    <div id="quiz-section" class="content-section">
      <h2 id="quiz-title" style="margin-bottom: 10px; font-size: 1.4rem; color: #818cf8;">Simulador de Examen</h2>
      <div class="quiz-info" id="quiz-info"></div>
      <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="evaluateQuiz()">Calificar Examen Completo</button>
      </form>
      <div id="score-result"></div>
    </div>
  </div>

  <script>

      ],
      integracion: [
        { topic: "Trabajo Multidisciplinario", text: "Conecta distintas materias para resolver problemas reales del entorno escolar y comunitario." }
      ]
    };

    function getSubjectsByGrade(grade) {
      let scienceSubject = { id: "biologia", name: "Biología" };
      if (grade === "2") scienceSubject = { id: "fisica", name: "Física (Ciencias II)" };
      if (grade === "3") scienceSubject = { id: "quimica", name: "Química (Ciencias III)" };

      return [
        scienceSubject,
        { id: "espanol", name: "Español" },
        { id: "matematicas", name: "Matemáticas" },
        { id: "historia", name: "Historia" },
        { id: "geografia", name: "Geografía" },
        { id: "formacion", name: "Formación Cívica y Ética" },
        { id: "tecnologia", name: "Tecnología" },
        { id: "ingles", name: "Inglés" },
        { id: "artes", name: "Artes" },
        { id: "educacion_fisica", name: "Educación Física" },
        { id: "tutoria", name: "Tutoría" },
        { id: "integracion", name: "Integración Curricular" }
      ];
    }

    function updateSubjectsAndContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjects = getSubjectsByGrade(grade);

      subjectSelect.innerHTML = '';
      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub.id;
        opt.textContent = sub.name;
        subjectSelect.appendChild(opt);
      });

      renderAll();
    }

    let randomSessionSeed = Math.floor(Math.random() * 100000);

    // Bancos exclusivos, detallados y sin repeticiones por materia
    const masterBanks = {
      matematicas: [
        { q: "¿Cuál es el resultado de la operación combinada: 10 + 2 × 5?", opts: ["20", "60", "17", "12"], correct: 0, exp: "💡 Explicación: Primero se multiplica (2 × 5 = 10) y luego se suma (10 + 10 = 20)." },

    function generate50Questions(grade, subject) {
      const questions = [];
      const experts = {
        matematicas: "Validado por Científicos Matemáticos",
        fisica: "Validado por Físicos Teóricos",
        quimica: "Validado por Químicos Investigadores",
        biologia: "Validado por Biólogos Celulares",
        espanol: "Validado por Lingüistas y Filólogos",
        historia: "Validado por Historiadores Académicos",
        geografia: "Validado por Geógrafos Profesionales",
        formacion: "Validado por Especialistas en Derechos Humanos",
        tecnologia: "Validado por Ingenieros en Sistemas",
        ingles: "Validado por Expertos en la Enseñanza de Idiomas",
        artes: "Validado por Maestros en Estética y Bellas Artes",
        educacion_fisica: "Validado por Expertos en Kinesiología y Deporte",
        tutoria: "Validado por Psicólogos Educativos",
        integracion: "Validado por Especialistas en Proyectos Multidisciplinarios"
      };

      const expertTitle = experts[subject] || "Validado por Especialistas Académicos";
      const subjectPool = masterBanks[subject] || masterBanks["espanol"];

      for (let i = 1; i <= 50; i++) {
        // Seleccionamos secuencialmente del banco exclusivo de la materia combinando la semilla aleatoria
        const itemIndex = (i - 1 + randomSessionSeed) % subjectPool.length;
        const item = subjectPool[itemIndex];

        let qText = `Pregunta ${i}: ${item.q}`;
        if (i > subjectPool.length) {
          qText = `Pregunta ${i} (Variante de Repaso): Reforzando el concepto de: ${item.q}`;
        }

        questions.push({
          id: i,
          expertNote: expertTitle,
          question: qText,
          options: item.opts,
          correct: item.correct,
          explanation: item.exp
        });
      }
      return questions;
    }

    function renderStudyContent() {
      const grade = document.getElementById('grade-select').value;
      const subjectSelect = document.getElementById('subject-select');
      const subjectId = subjectSelect.value;
      const subjectName = subjectSelect.options[subjectSelect.selectedIndex]?.text || subjectId;
      
      document.getElementById('study-title').innerText = `Puntos Clave: ${subjectName} (${grade}º Grado)`;
      const container = document.getElementById('study-content');
      container.innerHTML = '';

      const items = summariesData[subjectId] || [
        { topic: "Conceptos Fundamentales", text: "Revisa los apuntes clave para reforzar tu aprendizaje." }
      ];

      items.forEach(item => {
        container.innerHTML += `
          <div class="summary-card">
            <h3>📌 ${item.topic}</h3>
            <p>${item.text}</p>
          </div>
        `;
      });
    }

    function renderQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const sampleQ = generate50Questions(grade, subjectId)[0];

      document.getElementById('quiz-info').innerHTML = 
        `✨ <strong>${sampleQ.expertNote}</strong> | Examen único y exclusivo de esta materia.<br>Al seleccionar tu respuesta, el bloque cambiará a <strong>verde</strong> o <strong>rojo</strong> con explicaciones claras para memorizar.`;

      const questions = generate50Questions(grade, subjectId);
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      questions.forEach((q, index) => {
        let optsHtml = '';
        q.options.forEach((opt, optIdx) => {
          optsHtml += `
            <li>
              <label class="option-label">
                <input type="radio" name="q${index}" value="${optIdx}" onchange="handleAnswer(${index}, ${q.correct})">
                ${opt}
              </label>
            </li>
          `;
        });

        container.innerHTML += `
          <div class="question-block" id="block-${index}">
            <p class="question-title">${q.question}</p>
            <ul class="options-list">${optsHtml}</ul>
            <div class="explanation" id="exp-${index}">
              ${q.explanation}
            </div>
          </div>
        `;
      });
    }

    function handleAnswer(index, correctIndex) {
      const block = document.getElementById(`block-${index}`);
      const checked = document.querySelector(`input[name="q${index}"]:checked`);
      
      if (!checked) return;

      const userChoice = parseInt(checked.value);
      block.classList.remove('correct-answer', 'wrong-answer');

      setTimeout(() => {
        if (userChoice === correctIndex) {
          block.classList.add('correct-answer');
        } else {
          block.classList.add('wrong-answer');
        }
      }, 500);
    }

    function closeModal(refresh) {
      document.getElementById('update-modal').style.display = 'none';
      if (refresh) {
        randomSessionSeed = Math.floor(Math.random() * 100000);
        renderAll();
      }
    }

    function evaluateQuiz() {
      const grade = document.getElementById('grade-select').value;
      const subjectId = document.getElementById('subject-select').value;
      const questions = generate50Questions(grade, subjectId);
      let score = 0;

      questions.forEach((q, index) => {
        const checked = document.querySelector(`input[name="q${index}"]:checked`);
        if (checked && parseInt(checked.value) === q.correct) {
          score++;
        }
      });

      const resDiv = document.getElementById('score-result');
      resDiv.style.display = 'block';
      const pct = (score / 50) * 100;

      if (pct >= 60) {
        resDiv.style.background = 'rgba(34, 197, 94, 0.2)';
        resDiv.style.color = '#86efac';
        resDiv.style.border = '1px solid rgba(34, 197, 94, 0.4)';
        resDiv.innerText = `🎉 ¡Excelente trabajo! Obtuviste ${score} de 50 aciertos (${pct}%). ¡Estás listo para aprobar tu examen!`;
      } else {
        resDiv.style.background = 'rgba(239, 68, 68, 0.2)';
        resDiv.style.color = '#fca5a5';
        resDiv.style.border = '1px solid rgba(239, 68, 68, 0.4)';
        resDiv.innerText = `📚 Obtuviste ${score} de 50 aciertos (${pct}%). Revisa las explicaciones y repasa los Puntos Clave para mejorar tu nota.`;
      }
    }

    function renderAll() {
      renderStudyContent();
      renderQuiz();
      document.getElementById('score-result').style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('study-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('quiz-section').classList.add('active');
      }
    }

    updateSubjectsAndContent();
  </script>
